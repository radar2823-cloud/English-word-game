<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영단어 5자</title>
  <meta name="description" content="12시간마다 바뀌는 5글자 영어 단어 게임">
  <meta name="theme-color" content="#fee500">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --ink: #171717;
      --muted: #60656f;
      --line: #d9deea;
      --tile: #ffffff;
      --tile-active: #fff5bf;
      --correct: #18845e;
      --present: #d59618;
      --absent: #747b86;
      --accent: #fee500;
      --accent-ink: #161616;
      --danger: #d44747;
      --shadow: 0 18px 48px rgba(18, 24, 38, 0.12);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(23, 23, 23, 0.035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23, 23, 23, 0.035) 1px, transparent 1px),
        var(--bg);
      background-size: 36px 36px;
      color: var(--ink);
    }

    button {
      font: inherit;
    }

    .app {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 16px 28px;
      display: flex;
      align-items: center;
    }

    .game {
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(217, 222, 234, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
    }

    .brand-mark svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 8px 12px rgba(23, 23, 23, 0.14));
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1;
      letter-spacing: 0;
    }

    .date-line {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      word-break: keep-all;
    }

    .icon-button,
    .control-button,
    .key,
    .share-button,
    .close-button {
      border: 0;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 900;
      font-size: 1.12rem;
      box-shadow: 0 9px 16px rgba(180, 151, 0, 0.22);
    }

    .icon-button:hover,
    .control-button:hover,
    .key:hover,
    .share-button:hover,
    .close-button:hover {
      transform: translateY(-1px);
    }

    .board {
      display: grid;
      gap: 8px;
      width: min(100%, 410px);
      margin: 0 auto;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .tile {
      aspect-ratio: 1;
      min-width: 0;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 2px solid var(--line);
      background: var(--tile);
      color: var(--ink);
      font-size: 2.1rem;
      line-height: 1;
      font-weight: 900;
      box-shadow: inset 0 -2px 0 rgba(23, 23, 23, 0.04);
      text-transform: uppercase;
      user-select: none;
    }

    .tile.filled {
      border-color: #abb3c4;
      background: var(--tile-active);
    }

    .tile.correct,
    .tile.present,
    .tile.absent {
      color: #ffffff;
      border-color: transparent;
    }

    .tile.correct {
      background: var(--correct);
    }

    .tile.present {
      background: var(--present);
    }

    .tile.absent {
      background: var(--absent);
    }

    .status {
      min-height: 28px;
      margin: 12px 0 8px;
      text-align: center;
      color: var(--muted);
      font-weight: 800;
      line-height: 1.4;
      word-break: keep-all;
    }

    .status.is-alert {
      color: var(--danger);
    }

    .controls {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .keyboard {
      display: grid;
      gap: 7px;
    }

    .key-row {
      display: grid;
      gap: 6px;
    }

    .key-row:first-child {
      grid-template-columns: repeat(10, minmax(0, 1fr));
    }

    .key-row:nth-child(2) {
      width: 92%;
      margin: 0 auto;
      grid-template-columns: repeat(9, minmax(0, 1fr));
    }

    .key-row:nth-child(3) {
      width: 78%;
      margin: 0 auto;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .key {
      min-width: 0;
      min-height: 45px;
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 900;
      font-size: 1rem;
      box-shadow: 0 5px 10px rgba(18, 24, 38, 0.07);
    }

    .key.correct,
    .key.present,
    .key.absent {
      color: #ffffff;
      border-color: transparent;
    }

    .key.correct {
      background: var(--correct);
    }

    .key.present {
      background: var(--present);
    }

    .key.absent {
      background: var(--absent);
    }

    .action-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
    }

    .control-button {
      min-height: 50px;
      border-radius: 8px;
      background: #181818;
      color: #ffffff;
      font-weight: 900;
      box-shadow: 0 9px 18px rgba(18, 24, 38, 0.18);
    }

    .control-button.backspace {
      background: #ffffff;
      color: var(--ink);
      border: 1px solid var(--line);
      font-size: 1.4rem;
    }

    .result-panel {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #ffffff;
    }

    .result-title {
      margin: 0 0 8px;
      font-size: 1.12rem;
      font-weight: 900;
    }

    .answer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--muted);
      font-weight: 800;
    }

    .answer strong {
      color: var(--ink);
      font-size: 1.15rem;
    }

    .word-note {
      margin: 10px 0 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .word-note-title {
      margin: 0 0 8px;
      color: var(--ink);
      font-weight: 900;
    }

    .word-note dl {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 7px 10px;
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-weight: 700;
    }

    .word-note dt {
      color: var(--ink);
      font-weight: 900;
    }

    .word-note dd {
      margin: 0;
    }

    .word-note .example {
      color: var(--ink);
    }

    .share-button {
      width: 100%;
      min-height: 46px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 900;
      box-shadow: 0 9px 18px rgba(180, 151, 0, 0.2);
    }

    .share-output {
      width: 100%;
      min-height: 112px;
      margin-top: 10px;
      resize: vertical;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 10px;
      color: var(--ink);
      background: #f8fafc;
      font: 0.92rem ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    [hidden] {
      display: none !important;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(9, 13, 21, 0.44);
    }

    .modal-card {
      width: min(100%, 420px);
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      padding: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    }

    .modal-card h2 {
      margin: 0 0 12px;
      font-size: 1.18rem;
      letter-spacing: 0;
    }

    .rules {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
      line-height: 1.72;
      font-weight: 700;
      word-break: keep-all;
    }

    .legend {
      display: grid;
      gap: 8px;
      margin: 14px 0;
    }

    .legend-item {
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-weight: 800;
    }

    .legend-chip {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .legend-chip.correct {
      background: var(--correct);
    }

    .legend-chip.present {
      background: var(--present);
    }

    .legend-chip.absent {
      background: var(--absent);
    }

    .close-button {
      width: 100%;
      min-height: 42px;
      border-radius: 8px;
      background: #181818;
      color: #ffffff;
      font-weight: 900;
    }

    @media (max-width: 420px) {
      .app {
        padding: 12px 10px 18px;
        align-items: stretch;
      }

      .game {
        padding: 14px 12px;
      }

      .brand-mark {
        width: 50px;
        height: 50px;
      }

      h1 {
        font-size: 1.72rem;
      }

      .date-line {
        font-size: 0.84rem;
      }

      .row,
      .board {
        gap: 6px;
      }

      .tile {
        font-size: 1.7rem;
      }

      .key {
        min-height: 42px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>

  <main class="app">
    <section class="game" aria-label="영단어 5 게임">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 120 120" role="img" aria-label="영단어 5 로고">
              <rect x="5" y="5" width="110" height="110" rx="24" fill="#fee500"></rect>
              <rect x="24" y="24" width="72" height="72" rx="12" fill="#181818"></rect>
              <rect x="32" y="32" width="24" height="24" rx="6" fill="#18845e"></rect>
              <rect x="64" y="32" width="24" height="24" rx="6" fill="#d59618"></rect>
              <rect x="32" y="64" width="24" height="24" rx="6" fill="#ffffff"></rect>
              <text x="75" y="84" text-anchor="middle" font-size="34" font-weight="900" fill="#ffffff" font-family="Arial, sans-serif">W</text>
            </svg>
          </div>
          <div>
            <h1>영단어 5</h1>
            <p class="date-line" id="dateLine">오늘의 문제</p>
          </div>
        </div>
        <button class="icon-button" id="helpButton" type="button" aria-label="도움말" title="도움말">?</button>
      </header>

      <div class="board" id="board" aria-label="입력판"></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>

      <section class="controls" aria-label="영어 입력">
        <div class="keyboard" id="keyboard"></div>
        <div class="action-row">
          <button class="control-button backspace" id="backspaceButton" type="button" aria-label="지우기" title="지우기">⌫</button>
          <button class="control-button" id="enterButton" type="button">입력</button>
        </div>
      </section>

      <section class="result-panel" id="resultPanel" hidden>
        <p class="result-title" id="resultTitle"></p>
        <div class="answer" id="answerLine"></div>
        <div class="word-note" id="wordNote" hidden></div>
        <button class="share-button" id="shareButton" type="button">결과 공유</button>
        <textarea class="share-output" id="shareOutput" readonly hidden></textarea>
      </section>
    </section>
  </main>

  <div class="modal" id="helpModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <h2 id="helpTitle">게임 규칙</h2>
      <ol class="rules">
        <li>정답은 5글자 영어 단어입니다.</li>
        <li>화면 키보드나 실제 키보드로 알파벳을 입력합니다.</li>
        <li>목록에 있는 영어 단어만 제출할 수 있습니다.</li>
      </ol>
      <div class="legend" aria-label="색상 표시">
        <div class="legend-item"><span class="legend-chip correct"></span><span>위치까지 맞음</span></div>
        <div class="legend-item"><span class="legend-chip present"></span><span>포함되지만 위치가 다름</span></div>
        <div class="legend-item"><span class="legend-chip absent"></span><span>정답에 없음</span></div>
      </div>
      <button class="close-button" id="closeHelpButton" type="button">닫기</button>
    </div>
  </div>

        ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],

      const validGuesses = buildValidGuesses();
      const today = getToday();
      const solution = pickSolution(today.dateKey);
      const storageKey = `word5:${today.dateKey}`;
      let state = loadState();

      dateLine.textContent = `${today.label} · ${String(today.puzzleNumber).padStart(3, "0")}번째`;

        if (event.target === helpModal) {
          helpModal.hidden = true;
        }

      document.addEventListener("keydown", handleKeydown);

      function buildSolutions() {
        const valid = ANSWERS
          .map(normalizeWord)
          .filter((word) => word.length === WORD_LENGTH && /^[A-Z]+$/.test(word));

        if (valid.length !== ANSWERS.length) {
          const invalid = ANSWERS.filter((word) => normalizeWord(word).length !== WORD_LENGTH || !/^[A-Z]+$/.test(normalizeWord(word)));
          console.warn("5글자 영어 단어가 아닌 정답 후보:", invalid);
        }

        if (!valid.length) {
          throw new Error("사용할 수 있는 5글자 영어 정답이 없습니다.");
        }

        return [...new Set(valid)].map((word) => ({ word, letters: [...word] }));
      }

      function buildValidGuesses() {
        const words = [...ANSWERS, ...EXTRA_GUESSES]
          .map(normalizeWord)
          .filter((word) => word.length === WORD_LENGTH && /^[A-Z]+$/.test(word));
        return new Set(words);
      }

      function normalizeWord(word) {
        return String(word).trim().toUpperCase();
      }

      function getToday() {
        const now = new Date();
        const kst = new Date(now.getTime() + KST_OFFSET_MS);
        const year = kst.getUTCFullYear();
        const month = kst.getUTCMonth() + 1;
        const date = kst.getUTCDate();
        const hour = kst.getUTCHours();
        const slot = hour < 12 ? "AM" : "PM";
        const slotLabel = hour < 12 ? "오전" : "오후";
        const slotNumber = Math.floor((now.getTime() + KST_OFFSET_MS) / HALF_DAY_MS);
        return {
          dateKey: `${year}-${pad(month)}-${pad(date)}-${slot}`,
          label: `${year}.${pad(month)}.${pad(date)} ${slotLabel}`,
          slotNumber,
          puzzleNumber: Math.max(1, slotNumber - BASE_SLOT + 1)
        };
      }

      function pickSolution(dateKey) {
        let bestSolution = solutions[0];
        let bestScore = -1;

        for (const candidate of solutions) {
          const score = hashString(`${DAILY_RANDOM_SEED}:${dateKey}:${candidate.word}`);
          if (score > bestScore) {
            bestScore = score;
            bestSolution = candidate;
          }
        }

        return bestSolution;
      }

      function hashString(input) {
        let hash = 2166136261;

        for (let index = 0; index < input.length; index += 1) {
          hash ^= input.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }

        hash ^= hash >>> 16;
        hash = Math.imul(hash, 2246822507);
        hash ^= hash >>> 13;
        hash = Math.imul(hash, 3266489909);
        hash ^= hash >>> 16;

        return hash >>> 0;
      }

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function loadState() {
        const fresh = {
          guesses: [],
          current: "",
          done: false,
          won: false
        };

        try {
          const saved = JSON.parse(localStorage.getItem(storageKey));
          if (!saved || saved.solution !== solution.word) {
            return fresh;
          }

          return {
            guesses: Array.isArray(saved.guesses)
              ? saved.guesses.map(normalizeWord).filter((word) => word.length === WORD_LENGTH).slice(0, MAX_ATTEMPTS)
              : [],
            current: "",
            done: Boolean(saved.done),
            won: Boolean(saved.won)
          };
        } catch (error) {
          return fresh;
        }
      }

      function saveState() {
        localStorage.setItem(storageKey, JSON.stringify({
          solution: solution.word,
          guesses: state.guesses,
          done: state.done,
          won: state.won
        }));
      }

      function buildKeyboard() {
        keyboard.innerHTML = "";
        for (const row of KEY_ROWS) {
          const rowElement = document.createElement("div");
          rowElement.className = "key-row";
          for (const letter of row) {
            const button = document.createElement("button");
            button.className = "key";
            button.type = "button";
            button.textContent = letter;
            button.dataset.letter = letter;
            button.setAttribute("aria-label", `${letter} 입력`);
            button.addEventListener("click", () => addLetter(letter));
            rowElement.append(button);
          }
          keyboard.append(rowElement);
        }
      }

      function handleKeydown(event) {
        if (event.metaKey || event.ctrlKey || event.altKey) {
          return;
        }

        if (event.key === "Escape") {
          helpModal.hidden = true;
          return;
        }

        if (!helpModal.hidden || event.target === shareOutput) {
          return;
        }

        if (event.key === "Enter") {
          event.preventDefault();
          submitGuess();
          return;
        }

        if (event.key === "Backspace") {
          event.preventDefault();
          eraseLetter();
          return;
        }

        const letter = event.key.toUpperCase();
        if (/^[A-Z]$/.test(letter)) {
          event.preventDefault();
          addLetter(letter);
        }
      }

      function addLetter(letter) {
        if (state.done) {
          showStatus("오늘 문제는 이미 완료했습니다.");
          return;
        }

        if (state.current.length >= WORD_LENGTH) {
          showStatus("5글자가 모두 찼습니다.", true);
          return;
        }

        state.current += letter;
        shareOutput.hidden = true;
        render();
      }

      function eraseLetter() {
        if (state.done) {
          showStatus("오늘 문제는 이미 완료했습니다.");
          return;
        }

        state.current = state.current.slice(0, -1);
        shareOutput.hidden = true;
        render();
      }

      function submitGuess() {
        if (state.done) {
          showStatus("오늘 문제는 이미 완료했습니다.");
          return;
        }

        if (state.current.length !== WORD_LENGTH) {
          showStatus("5글자를 채워주세요.", true);
          return;
        }

        const guess = state.current;
        if (!validGuesses.has(guess)) {
          showStatus("등록된 5글자 영어 단어만 입력할 수 있습니다.", true);
          return;
        }

        const grades = gradeGuess(guess, solution.word);
        state.guesses.push(guess);
        state.current = "";

        if (grades.every((grade) => grade === "correct")) {
          state.done = true;
          state.won = true;
          showStatus("정답입니다.");
        } else if (state.guesses.length >= MAX_ATTEMPTS) {
          state.done = true;
          state.won = false;
          showStatus("다음 문제는 내일 열립니다.");
        } else {
          showStatus(`${MAX_ATTEMPTS - state.guesses.length}번 남았습니다.`);
        }

        saveState();
        render();
      }

      function gradeGuess(guess, answer) {
        const guessLetters = [...guess];
        const answerLetters = [...answer];
        const grades = Array(WORD_LENGTH).fill("absent");
        const counts = new Map();

        for (let index = 0; index < WORD_LENGTH; index += 1) {
          if (guessLetters[index] === answerLetters[index]) {
            grades[index] = "correct";
          } else {
            counts.set(answerLetters[index], (counts.get(answerLetters[index]) || 0) + 1);
          }
        }

        for (let index = 0; index < WORD_LENGTH; index += 1) {
          if (grades[index] === "correct") {
            continue;
          }

          const letter = guessLetters[index];
          const count = counts.get(letter) || 0;
          if (count > 0) {
            grades[index] = "present";
            counts.set(letter, count - 1);
          }
        }

        return grades;
      }

      function render() {
        renderBoard();
        renderKeyboardState();
        renderResult();
      }

      function renderBoard() {
        board.innerHTML = "";

        for (let rowIndex = 0; rowIndex < MAX_ATTEMPTS; rowIndex += 1) {
          const row = document.createElement("div");
          row.className = "row";
          const guess = state.guesses[rowIndex] || (rowIndex === state.guesses.length ? state.current : "");
          const grades = state.guesses[rowIndex] ? gradeGuess(state.guesses[rowIndex], solution.word) : [];

          for (let colIndex = 0; colIndex < WORD_LENGTH; colIndex += 1) {
            const tile = document.createElement("div");
            tile.className = "tile";
            tile.textContent = guess[colIndex] || "";

            if (state.guesses[rowIndex]) {
              tile.classList.add(grades[colIndex]);
            } else if (guess[colIndex]) {
              tile.classList.add("filled");
            }

            row.append(tile);
          }

          board.append(row);
        }
      }

      function renderKeyboardState() {
        const keyState = getKeyState();
        document.querySelectorAll(".key").forEach((button) => {
          button.classList.remove("correct", "present", "absent");
          const grade = keyState.get(button.dataset.letter);
          if (grade) {
            button.classList.add(grade);
          }
        });
      }

      function getKeyState() {
        const priority = { absent: 1, present: 2, correct: 3 };
        const keyState = new Map();

        for (const guess of state.guesses) {
          const grades = gradeGuess(guess, solution.word);
          [...guess].forEach((letter, index) => {
            const next = grades[index];
            const prev = keyState.get(letter);
            if (!prev || priority[next] > priority[prev]) {
              keyState.set(letter, next);
            }
          });
        }

        return keyState;
      }

      function renderResult() {
        if (!state.done) {
          resultPanel.hidden = true;
          wordNote.hidden = true;
          return;
        }

        resultPanel.hidden = false;
        resultTitle.textContent = state.won
          ? `${state.guesses.length}번 만에 맞췄습니다.`
          : "오늘은 여기까지입니다.";
        answerLine.innerHTML = `정답 <strong>${solution.word}</strong>`;
        renderWordNote(solution.word);
      }

      function renderWordNote(word) {
        const note = WORD_NOTES[word];
        wordNote.innerHTML = "";
        wordNote.hidden = false;

        const title = document.createElement("p");
        title.className = "word-note-title";
        title.textContent = "단어 노트";
        wordNote.append(title);

        const list = document.createElement("dl");
        appendNoteRow(list, "뜻", note ? note.meaning : "아직 등록된 뜻이 없습니다.");
        appendNoteRow(list, "예문", note ? note.example : "WORD_NOTES에 뜻과 예문을 추가해주세요.", "example");
        wordNote.append(list);
      }

      function appendNoteRow(list, label, text, valueClass = "") {
        const term = document.createElement("dt");
        term.textContent = label;

        const description = document.createElement("dd");
        description.textContent = text;
        if (valueClass) {
          description.className = valueClass;
        }

        list.append(term, description);
      }

      function showStatus(message, alert = false) {
        status.textContent = message;
        status.classList.toggle("is-alert", alert);
      }

      async function shareResult() {
        const shareData = buildShareData();

        if (navigator.share) {
          try {
            await navigator.share(shareData);
            return;
          } catch (error) {
            if (error.name === "AbortError") {
              return;
            }
          }
        }

        try {
          await navigator.clipboard.writeText(buildShareText(shareData));
          showStatus("결과를 복사했습니다.");
          shareOutput.hidden = true;
        } catch (error) {
          shareOutput.hidden = false;
          shareOutput.value = buildShareText(shareData);
          shareOutput.focus();
          shareOutput.select();
          showStatus("아래 결과를 복사하세요.");
        }
      }

      function buildShareData() {
        const score = state.won ? `${state.guesses.length}/${MAX_ATTEMPTS}` : `X/${MAX_ATTEMPTS}`;
        const rows = state.guesses.map((guess) => gradeGuess(guess, solution.word)
          .map((grade) => ({ correct: "🟩", present: "🟨", absent: "⬛" })[grade])
          .join(""));
        const url = window.location.href.split("#")[0];
        return {
          title: "영단어 5",
          text: [`영단어 5 ${today.label} ${score}`, ...rows].join("\n"),
          url
        };
      }

      function buildShareText(shareData) {
        return [shareData.text, shareData.url].join("\n");
      }
    })();
  </script>
</body>
</html>
